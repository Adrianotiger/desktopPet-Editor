name: DesktopPet Editor Bug Report
description: Report a bug or unexpected behavior in the DesktopPet Editor
title: "[Bug] "
labels:
  - bug
  - editor

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DesktopPet Editor.

        Please provide as much detail as possible so the issue can be reproduced and fixed.

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: What is the problem?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Open DesktopPet Editor
        2. Load a pet
        3. Open the Animation Editor
        4. Click Save
        5. The application crashes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: The animation should be saved successfully.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: The editor crashed with an exception.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Messages or Logs
      description: Paste any error messages, stack traces or log entries here.
      render: text

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Only once
    validations:
      required: true

  - type: input
    id: pet
    attributes:
      label: Pet Name (if applicable)
      placeholder: MyPet

  - type: input
    id: browser
    attributes:
      label: Browser and Operating System
      placeholder: Firefox, Windows 11
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Files
      description: Drag and drop screenshots, videos, logs, XML files or other files after creating the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for existing issues before creating this report
          required: true
        - label: I can reproduce this issue consistently
          required: false
        - label: I attached screenshots or additional files if available
          required: false
