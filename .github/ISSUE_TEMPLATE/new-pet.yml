name: New Pet Submission
description: Submit a new DesktopPet/eSheep pet
title: "[New Pet] "
labels:
  - pet-submission

body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to DesktopPet/eSheep!

        You can either:

        - Attach a ZIP containing all files
        - Attach the individual files directly

        Required files:

        - animations.xml (generated by the editor)
        - icon.png (48x48 pixels)
        - README.md

        A GitHub Action will validate the submission and create a Pull Request automatically.

  - type: input
    id: petname
    attributes:
      label: Pet Name
      description: Unique name of the pet
      placeholder: Dancing Sheep
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author
      description: Creator of the pet
      placeholder: Your name or nickname
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Short description for testing this mate
      placeholder: Describe what you want to communicate to the community...
    validations:
      required: true

  - type: textarea
    id: installation
    attributes:
      label: Submission Files
      description: |
        Drag and drop the files directly into the issue body or into a comment.

        Accepted:

        - animations.xml
        - icon.png
        - README.md

        or

        - file.zip containing the 3 files.

      placeholder: After creating the issue, drag and drop files into a comment.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: icon.png is valid
          required: true
        - label: animations.xml is included (or inside the ZIP)
          required: true
        - label: README.md is included (or inside the ZIP)
          required: true
        - label: I am the author or have permission to submit these files
          required: true
          
