name: Validate Pet Submission

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:    
      - name: Check label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels.*.name) }}'

          if [[ "$LABELS" == *"pet-submission"* ]]; then
            echo "VALID=true" >> $GITHUB_OUTPUT
          else
            echo "VALID=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if not pet submission
        if: steps.check.outputs.valid != 'true'
        run: |
          echo "Not a pet submission"

      - uses: actions/checkout@v4

      - name: Extract pet name
        if: steps.check.outputs.valid == 'true'
        id: pet
        run: |
          python .github/scripts/extract_issue_data.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
       
      - name: Download files
        if: steps.check.outputs.valid == 'true'
        id: download
        continue-on-error: true
        run: |
          python .github/scripts/download_files.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Validate image
        if: steps.check.outputs.valid == 'true'
        id: validateImage
        continue-on-error: true
        run: |
          python .github/scripts/validate_image.py

      - name: Validate readme
        if: steps.check.outputs.valid == 'true'
        id: validateReadme
        continue-on-error: true
        run: |
          python .github/scripts/validate_readme.py

      - name: Validate XML
        if: steps.check.outputs.valid == 'true'
        id: validateXml
        continue-on-error: true
        run: |
          python .github/scripts/validate_xml.py

      - name: Read validation results
        id: results
        if: steps.check.outputs.valid == 'true'
        run: |
          {
            echo 'logs<<EOF'
            cat logs.txt
            echo EOF
          } >> $GITHUB_OUTPUT
      
          {
            echo 'errors<<EOF'
            cat submission/errors.txt
            echo EOF
          } >> $GITHUB_OUTPUT
      
          if [ -s errors.txt ]; then
            echo "success=false" >> $GITHUB_OUTPUT
          else
            echo "success=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Comment on issue
        if: steps.check.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const petName = "${{ steps.pet.outputs.petname }}" || "Unknown";
            const author = "${{ steps.pet.outputs.author }}" || "Unknown";
      
            const logs = `${{ steps.results.outputs.logs }}`;
            const errors = `${{ steps.results.outputs.errors }}`;
      
            const success = "${{ steps.results.outputs.success }}" === "true";
      
            let status;
            if (success) {
              status = "✅ Validation successful";
            } else {
              status = "❌ Validation failed";
            }
      
            let body = `${status}
      
            Pet Name: **${petName}**
            Author: **${author}**
      
            ## Logs
      
            \`\`\`
            ${logs}
            \`\`\`
            `;
      
            if (!success) {
              body += `
      
            ## Errors
      
            \`\`\`
            ${errors}
            \`\`\`
            `;
            }
      
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
