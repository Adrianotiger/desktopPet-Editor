name: Validate Pet Submission

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:    
      - name: Check label
        id: check
        run: |
          LABELS='${{ toJson(github.event.issue.labels.*.name) }}'

          if [[ "$LABELS" == *"pet-submission"* ]]; then
            echo "VALID=true" >> $GITHUB_OUTPUT
          else
            echo "VALID=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if not pet submission
        if: steps.check.outputs.valid != 'true'
        run: |
          echo "Not a pet submission"

      - name: Extract pet name
        if: steps.check.outputs.valid == 'true'
        id: pet
        run: |
          python .github/scripts/extract_issue_data.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - uses: actions/checkout@v4
       
      - name: Download files
        if: steps.check.outputs.valid == 'true'
        id: download
        continue-on-error: true
        run: |
          python .github/scripts/download_files.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Validate files
        if: steps.check.outputs.valid == 'true'
        id: validate
        continue-on-error: true
        run: |
          python .github/scripts/validate_files.py

      - name: Extract attachments
        if: steps.check.outputs.valid == 'true'
        run: |
          python3 << 'PY'
          import re
          body = r"""${{ github.event.issue.body }}"""
          urls = re.findall(r'https://github\.com/user-attachments/[^\s")<>]+', body)
          print("Found URLs:")
          for url in urls:
              print(url)
          PY

      - name: Comment on issue
        if: steps.check.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const petName = "${{ steps.pet.outputs.petname }}" || "Unknown";

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
              `🤖 Validation started

              Pet Name: **${petName}**

              Checks currently enabled:

              ✅ Pet submission detected

              Future checks:
              ⬜ Download attached files
              ⬜ Validate icon.png (48x48)
              ⬜ Validate animations.xml
              ⬜ Validate README.md
              ⬜ Create Pull Request automatically`
            });
